[project]
name = "ai-qa-tester"
version = "2.5.0"
description = "AI-Powered eCommerce QA Testing Platform"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-limiter>=3.9.0",
    "requests>=2.34.2",
    "tinydb>=4.8.2",
    "playwright>=1.60.0",
    "waitress>=3.0.2",
]

[tool.vercel]
entrypoint = "smart_tester:app"
